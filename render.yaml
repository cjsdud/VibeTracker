# Render Blueprint — 대시보드에서 "New +" → "Blueprint"로 이 저장소를 선택하면
# 웹 서비스 + Postgres가 이 설정대로 한 번에 생성된다.
services:
  - type: web
    name: vibetrack
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm build
    # 무료 플랜은 pre-deploy 커맨드가 없으므로 시작 시 마이그레이션을 먼저 적용한다
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # 이게 없으면 웹 정적 파일이 서빙되지 않아 화면이 뜨지 않는다
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: INLINE_WORKER
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      # APP_URL은 비워두면 Render가 주입하는 RENDER_EXTERNAL_URL로 자동 대체된다
      - key: DATABASE_URL
        fromDatabase:
          name: vibetrack-db
          property: connectionString
      # GitHub 연동 시 대시보드에서 추가:
      # GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET,
      # GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET

databases:
  - name: vibetrack-db
    plan: free
